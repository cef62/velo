[package]
name = "velo"
version = "0.1.0"
description = "A fast keyboard-first notes app"
license = "MIT"
edition = "2024"

[lib]
name = "velo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
getrandom = "0.3.4"
libc = "0.2.191"
keyring = "4.2.0"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.11"
tokio = { version = "1", features = ["rt"] }
trash = "5.2.9"
unicode-normalization = "0.1.26"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
