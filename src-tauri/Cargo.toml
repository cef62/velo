[package]
name = "velo"
version = "0.1.0"
description = "A fast keyboard-first notes app"
license = "MIT"
edition = "2024"

[lib]
name = "velo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
unicode-normalization = "0.1.26"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
