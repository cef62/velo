<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>velo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="setup" hidden><button id="choose">Choose notes folder</button></div>
    <dialog id="pp">
      <form method="dialog">
        <h3></h3>
        <input type="password" autocomplete="off" placeholder="Passphrase" />
        <input type="password" autocomplete="off" placeholder="Confirm passphrase" />
        <div class="msg" role="alert"></div>
        <div class="row"><button type="button" value="cancel">Cancel</button><button type="submit">OK</button></div>
      </form>
    </dialog>
    <dialog id="settings">
      <form method="dialog">
        <h3>Settings</h3>
        <label>Notes folder <span id="s-dir"></span> <button type="button" id="s-choose">Change…</button></label>
        <label>Layout <select id="s-layout"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></label>
        <label>Font size <input id="s-font" type="number" min="10" max="32" /></label>
        <label>Sort <select id="s-sort"><option value="modified">Last modified</option><option value="title">Title A→Z</option></select></label>
        <table id="s-keys"></table>
        <div><button type="button" id="s-reset-all">Reset all shortcuts</button></div>
        <div class="msg" role="alert"></div>
        <div class="row"><button type="button" value="cancel">Cancel</button><button type="submit">Save</button></div>
      </form>
    </dialog>
    <div id="app">
      <div id="head">
      <header id="top">
        <input id="q" type="text" placeholder="Search or create…" autocomplete="off" spellcheck="false" />
        <button id="tagbtn" type="button" aria-pressed="false" aria-label="Show tags" title="Show / hide tags">#</button>
        <button id="sort" type="button"></button>
        <div id="toolbar">
          <button id="style" type="button" aria-pressed="true"></button>
          <button id="preview-badge" type="button" aria-label="Preview on — click to return to editing" title="Click to return to editing" hidden>Preview</button>
          <button id="lock" type="button" title="Lock / unlock note (⌘⇧E)">🔒</button>
          <button id="lockall" type="button" title="Lock all notes (⌥⌘E)">Lock all</button>
          <button id="trash" type="button" title="Move note to Trash (⌘⌫)" aria-label="Move note to Trash">🗑</button>
          <button id="gear" type="button" title="Settings (⌘,)">⚙</button>
        </div>
      </header>
      <div id="filterline" hidden><span></span> <button type="button">Clear</button></div>
      <div id="tagpanel" role="group" aria-label="Tags" hidden></div>
      </div>
      <div id="list"></div>
      <div id="divider" role="separator" tabindex="0" aria-label="Resize note list" title="Drag to resize (double-click resets)"></div>
      <div id="panes">
        <section id="note">
          <div id="titlebar"><span id="title" title="Double-click or ⌘R to rename"></span><span id="status"></span><span id="err"></span></div>
          <div id="editor"></div>
        </section>
        <aside id="preview" hidden></aside>
      </div>
    </div>
  </body>
</html>
