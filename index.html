<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>velo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="setup" hidden><button id="choose">Choose notes folder</button></div>
    <div id="app">
      <header id="top">
        <input id="q" type="text" placeholder="Search or create…" autocomplete="off" spellcheck="false" />
        <!-- toolbar hook (Task 11): lock/settings buttons go here -->
        <div id="toolbar"></div>
      </header>
      <ul id="list"></ul>
      <div id="panes">
        <section id="note">
          <div id="titlebar"><span id="title" title="Double-click or ⌘R to rename"></span><span id="err"></span></div>
          <div id="editor"></div>
        </section>
        <aside id="preview" hidden></aside>
      </div>
    </div>
  </body>
</html>
